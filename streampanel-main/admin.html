<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة IPTV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; color: #fff; margin-bottom: 20px; }
        .form-switch .form-check-input { width: 3em; height: 1.5em; cursor: pointer; }
        .table { color: #cbd5e1; }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <h2 class="mb-4 text-center">📺 لوحة إدارة القنوات والمشتركين</h2>

        <!-- قسم القنوات -->
        <div class="card p-3">
            <h4>إدارة القنوات (البث المباشر)</h4>
            <div class="row" id="channelsList"></div>
        </div>

        <!-- قسم إضافة مشترك -->
        <div class="card p-3">
            <h4>إضافة مشترك جديد</h4>
            <form id="addUserForm" class="row g-3">
                <div class="col-md-3">
                    <input type="text" id="username" class="form-control" placeholder="اسم المستخدم" required>
                </div>
                <div class="col-md-3">
                    <input type="text" id="password" class="form-control" placeholder="كلمة السر" required>
                </div>
                <div class="col-md-2">
                    <input type="number" id="max_connections" class="form-control" value="1" min="1" placeholder="عدد الأجهزة" required>
                </div>
                <div class="col-md-3">
                    <input type="date" id="expire_date" class="form-control" required>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100">إضافة</button>
                </div>
            </form>
        </div>

        <!-- جدول المشتركين -->
        <div class="card p-3">
            <h4>قائمة المشتركين</h4>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>المستخدم</th>
                            <th>كلمة السر</th>
                            <th>الأجهزة المسموح بها</th>
                            <th>تاريخ الانتهاء</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // تحميل القنوات
        async function loadChannels() {
            const res = await fetch('/api/channels');
            const channels = await res.json();
            const container = document.getElementById('channelsList');
            container.innerHTML = '';

            channels.forEach(ch => {
                container.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="p-3 border rounded border-secondary d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${ch.name}</strong>
                                <br><small class="text-muted">${ch.id}</small>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" ${ch.active ? 'checked' : ''} onchange="toggleChannel('${ch.id}', this.checked)">
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function toggleChannel(id, active) {
            await fetch('/api/channels/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, active })
            });
        }

        // تحميل المشتركين
        async function loadUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = '';

            users.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td><strong>${user.username}</strong></td>
                        <td><code>${user.password}</code></td>
                        <td><span class="badge bg-info">${user.max_connections} جهاز</span></td>
                        <td>${user.expire_date}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('addUserForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                max_connections: parseInt(document.getElementById('max_connections').value),
                expire_date: document.getElementById('expire_date').value
            };

            const res = await fetch('/api/users/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                e.target.reset();
                loadUsers();
            } else {
                const err = await res.json();
                alert(err.error);
            }
        };

        async function deleteUser(id) {
            if (confirm('هل أنت تأكد من حذف هذا المشترك؟')) {
                await fetch('/api/users/' + id, { method: 'DELETE' });
                loadUsers();
            }
        }

        loadChannels();
        loadUsers();
    </script>
</body>
</html>
